# The worker's environment, shared verbatim with the `sweep` service below.
#
# An anchor rather than a second copy, because the two halves of a night's work
# are split across them: the sweep driver decides what to enqueue and writes the
# report, and the long-lived worker performs each scrape. They have to agree.
# A SWEEP_DROP_* that drifted between the two would mean the guard the report
# describes is not the guard that ran, and nothing would say so.
#
# This block enumerates variables explicitly and there is no env_file, so
# anything absent here does NOT reach either container, however it is set in the
# server's .env.
x-worker-env: &worker-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/scrapnew
  API_TOKEN: ${API_TOKEN}
  NEXT_PUBLIC_APP_URL: http://web:3000
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  AI_REFINE_MODEL: ${AI_REFINE_MODEL:-gpt-5}
  # Nightly sweep.
  SWEEP_ENABLED: ${SWEEP_ENABLED:-true}
  SWEEP_TZ: ${SWEEP_TZ:-Asia/Jerusalem}
  SWEEP_FRESH_WINDOW_HOURS: ${SWEEP_FRESH_WINDOW_HOURS:-20}
  # 260 minutes from the 02:00 timer stops enqueueing at 06:20, so the last
  # site's 18-minute budget and the report land before the public jobs site
  # reads this database at 07:01. See worker/lib/sweepBudget.test.ts.
  SWEEP_MAX_RUNTIME_MINUTES: ${SWEEP_MAX_RUNTIME_MINUTES:-260}
  SWEEP_PER_SITE_TIMEOUT_MINUTES: ${SWEEP_PER_SITE_TIMEOUT_MINUTES:-18}
  SWEEP_POLL_INTERVAL_MS: ${SWEEP_POLL_INTERVAL_MS:-5000}
  SWEEP_POLICY_MAX_PER_NIGHT: ${SWEEP_POLICY_MAX_PER_NIGHT:-25}
  # The undersize guard, read by the long-lived worker's scrape handler (not
  # only the sweep driver): a scheduled run refuses to replace at least this
  # many listings with fewer than this share of them.
  SWEEP_DROP_MIN_PREVIOUS: ${SWEEP_DROP_MIN_PREVIOUS:-10}
  SWEEP_DROP_KEEP_RATIO: ${SWEEP_DROP_KEEP_RATIO:-0.5}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scrapnew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_TOKEN: ${NEXT_PUBLIC_API_TOKEN}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/scrapnew
      API_TOKEN: ${API_TOKEN}
      NEXT_PUBLIC_API_TOKEN: ${NEXT_PUBLIC_API_TOKEN}
      COMPANY_LOGO_DIR: /data/logos
    expose:
      - "3000"
    volumes:
      # Company logos. Written here by POST /api/sites/:id/company-logo and
      # served read-only by caddy at /logos/*. A named volume survives
      # `docker compose build` and deploy.sh's rsync --delete; it is lost only
      # on `docker compose down -v` or a host migration, which
      # scripts/rehydrate-logos.ts recovers from via companyLogoSourceUrl.
      - company_logos:/data/logos
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # Named explicitly so `sweep` can reuse it. This is the tag compose already
    # derived from the project name; pinning it only makes the reuse sayable.
    image: haide-scrapper-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *worker-env
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'worker/index.ts' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The nightly sweep driver. Started by the systemd timers, never by a deploy.
  #
  # Its own service rather than `docker compose run worker …` for three reasons,
  # each of which was going to bite at 02:00:
  #
  #   - the worker's healthcheck greps for `worker/index.ts`, and a sweep is not
  #     that process. Inherited, every sweep container would sit UNHEALTHY for
  #     its whole run, in the `docker compose ps` output an operator reads
  #     precisely when something has gone wrong;
  #   - `restart: unless-stopped` is right for a daemon and wrong for a job that
  #     is supposed to end. A sweep that finished would be started again;
  #   - a one-off `run` container named after the worker makes deploy.sh's
  #     "is a sweep in progress?" guard ambiguous. The timers name these
  #     `haide-sweep-scrape` and `haide-sweep-policy`, which is unmistakable.
  #
  # The profile is what keeps it out of `docker compose up -d`, which runs on
  # every deploy: without one, deploying would start a full fleet scrape.
  # `docker compose run --rm sweep …` ignores profiles, so the timers are
  # unaffected. Same precedent as db-backup above.
  sweep:
    image: haide-scrapper-worker
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *worker-env
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    profiles:
      - sweep

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - company_logos:/srv/company-logos:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-backup:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/backup-db.sh:/backup.sh:ro
      - db_backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    profiles:
      - backup

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  db_backups:
  company_logos:
