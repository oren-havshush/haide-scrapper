name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is read from the `packageManager` field in package.json
      # (pnpm@10.x — pinned because v11 requires Node 22 but we're on Node 20).
      # Do NOT also pass a `version:` here; action-setup errors out on dual config.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the skills are in sync and addsite2 is frozen
        run: pnpm check:skills

      # The compact copy of the shared form template is generated from it
      # (scripts/compact-form-template.mjs); a copy that drifted would put an
      # old capture into every setup script that pastes it. Runs in well under
      # a second.
      - name: Check the compact form template matches the template
        run: pnpm check:template

      # Asserts the bundled IL_CANONICAL still equals "CSV files/city.csv".
      # Production validates city writes against the bundled list because the
      # CSV is not in the standalone image, so drift between the two would let
      # an off-list city reach a column the public site reads. The CSV is in the
      # repo, so CI can compare them even though the runtime cannot.
      - name: Check the city vocabulary has not drifted
        run: pnpm test:locations

      - run: pnpm lint

      - name: Build Next.js
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          API_TOKEN: "build-placeholder"
        run: pnpm build

      - name: Build worker
        run: pnpm worker:build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: docker build -t scrapnew-web:${{ github.sha }} .

      # sharp judges and composites light logos (src/lib/logo-background.ts). An
      # image without its native build would store every logo unchanged with only
      # a console warning, so both images prove it composites one pixel. Our sharp
      # is pinned to the version next depends on (0.34.5): with two versions the
      # standalone trace put next's libvips at the top level and our binary nested,
      # and the web image could not load it (run #380).
      - name: The web image composites with sharp
        run: |
          docker image inspect -f 'web image {{.Size}} bytes' scrapnew-web:${{ github.sha }}
          docker run --rm --entrypoint sh scrapnew-web:${{ github.sha }} -c 'du -sk node_modules/sharp node_modules/@img/* 2>/dev/null || true'
          docker run --rm --entrypoint node scrapnew-web:${{ github.sha }} -e 'const s=require("sharp");s({create:{width:4,height:4,channels:4,background:{r:255,g:255,b:255,alpha:0}}}).flatten({background:"#1F2937"}).raw().toBuffer().then((b)=>{if(b[0]!==31||b[1]!==41||b[2]!==55)throw new Error("composite "+Array.from(b.subarray(0,3)));console.log("sharp",s.versions.sharp,"composites in the web image")})'

      - name: Build worker image
        run: docker build -t scrapnew-worker:${{ github.sha }} -f Dockerfile.worker .

      - name: The worker image composites with sharp (scripts/logo-background-pass.ts runs there)
        run: |
          docker run --rm --entrypoint node scrapnew-worker:${{ github.sha }} -e 'const s=require("sharp");s({create:{width:4,height:4,channels:4,background:{r:255,g:255,b:255,alpha:0}}}).flatten({background:"#1F2937"}).raw().toBuffer().then((b)=>{if(b[0]!==31||b[1]!==41||b[2]!==55)throw new Error("composite "+Array.from(b.subarray(0,3)));console.log("sharp",s.versions.sharp,"composites in the worker image")})'
